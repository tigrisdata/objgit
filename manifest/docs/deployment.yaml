apiVersion: apps/v1
kind: Deployment
metadata:
  name: objgit-docs
  labels:
    app.kubernetes.io/name: objgit-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: objgit-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: objgit-docs
    spec:
      runtimeClassName: kata
      securityContext:
        fsGroup: 65532
      # Auxesia refuses symbolic links, so a ConfigMap volume cannot hold the
      # docs. Auxesia also resolves its root once at startup, so a git-sync
      # sidecar that swaps the root link would leave it serving stale files.
      # Clone once, before the server starts.
      initContainers:
        - name: clone
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          args:
            - --repo=https://github.com/tigrisdata/objgit
            - --ref=main
            - --depth=1
            - --root=/git
            - --link=objgit
            - --one-time
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: git
              mountPath: /git
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: main
          image: ghcr.io/tigrisdata/auxesia:latest
          imagePullPolicy: "Always"
          args:
            - /git/objgit/docs
            - --listen
            - 0.0.0.0:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /llms.txt
              port: http
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: git
              mountPath: /git
              readOnly: true
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: git
          emptyDir: {}
        - name: tmp
          emptyDir: {}
